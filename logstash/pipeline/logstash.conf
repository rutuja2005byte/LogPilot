
input {
  file {
    path => "/var/log/logpilot/app.json"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    mode => "tail"
    codec => json
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "logpilot-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}
